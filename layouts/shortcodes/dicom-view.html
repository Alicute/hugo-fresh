<div class="dicom-viewer-container">
    <div id="controlsContainer">
        <input type="file" id="fileInput"/>
    </div>

    <div id="toast" style="
        position: fixed;
        top: 12%;
        left: 68%;
        transform: translateX(-50%);
        background-color: #0fdb80;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 9999;
        display: none;">
    </div>

    <div class="viewer-container">
        <!-- 左侧工具栏 -->
        <div class="toolbox">
            <button class="tool-button" id="rotateButton" title="旋转">旋转</button>
            <button class="tool-button" id="captureButton" title="拍照">截图</button>
            <button class="tool-button" id="contrastButton" title="反相">反相</button>
            <button class="tool-button" id="sharpenButton" title="锐化" style="display: none">锐化</button>
            <button class="tool-button" id="doubleWireButton" title="双丝测量">双丝</button>
        </div>

        <!-- 简化的 DICOM 查看器容器 -->
        <div id="dicomViewer" class="viewer-main"></div>

        <!-- 右侧控制区域 -->
        <div class="controls">
            <div class="info-group">
                <div class="mouse-position">
                    <span id="mousePosition">X: 0, Y: 0, 灰度值: 0</span>
                </div>
            </div>

            <div class="slider-group">
                <div>
                    <label for="zoomSlider">缩放:</label>
                    <input type="range" id="zoomSlider" min="0.05" max="4.0" step="0.05" value="1.0">
                    <input type="number" id="zoomInput" step="0.05" min="0.05" max="4.0" value="1.0">
                </div>
                <div>
                    <label for="windowLevelSlider">窗位:</label>
                    <input type="range" id="windowLevelSlider" min="0" max="65535" step="1" value="1">
                    <input type="number" id="windowLevelInput" step="1" min="-99999" max="99999" value="1">
                </div>
                <div>
                    <label for="windowWidthSlider">窗宽:</label>
                    <input type="range" id="windowWidthSlider" min="0" max="99999" step="1" value="1">
                    <input type="number" id="windowWidthInput" step="1" min="0" max="99999" value="1">
                </div>
                <div>
                    <label for="contrastSlider">对比度:</label>
                    <input type="range" id="contrastSlider" min="0" max="2" step="0.1" value="1">
                    <input type="number" id="contrastInput" step="0.1" min="0" max="2" value="1">
                </div>
                <div>
                    <button id="dicomResetButton" class="reset-button">重置</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 修改测量结果弹窗 -->
<div id="doubleWireModal" class="modal">
    <div class="modal-content">
        <span class="close" title="关闭">&times;</span>
        <div id="measurementResults">
            <!-- 动态内容将在这里生成 -->
        </div>
    </div>
</div>

    <script src="/js/lib/cornerstone.js"></script>
    <script src="/js/lib/cornerstoneWADOImageLoader.js"></script>
    <script src="/js/lib/dicomParser.js"></script>
    <script src="/js/lib/html2canvas.min.js"></script>
    <script src="/js/lib/lodash.min.js"></script>
    <script src="/js/custom/dicom-view.js"></script>
    <link rel="stylesheet" href="/css/dicom-view.css">
