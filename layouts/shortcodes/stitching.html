<!-- 基础容器 -->
<div class="stitching-container">
    <!-- 左侧图像列表 -->
    <div class="image-list-panel">
        <div class="panel-header">
            <h3>图像列表</h3>
            <div id="controlsContainer">
                <input type="file" id="fileInput" accept=".dcm" multiple/>
            </div>
        </div>
        <div class="image-list" id="imageList">
            <!-- 图像列表项将通过JS动态添加 -->
        </div>
    </div>

    <!-- 中间画布区域 -->
    <div class="canvas-container">
        <div id="canvasWrapper">
            <canvas id="fabricCanvas"></canvas>
        </div>
    </div>

    <!-- 右侧工具栏 -->
    <div class="tools-panel">
        <div class="tool-group">
            <h4>图像调节</h4>
            <div class="tool-item">
                <label>窗宽</label>
                <input type="range" id="windowWidthSlider" min="1" max="4000" value="400">
                <input type="number" id="windowWidthInput" min="1" max="4000" value="400">
            </div>
            <div class="tool-item">
                <label>窗位</label>
                <input type="range" id="windowLevelSlider" min="-1000" max="1000" value="40">
                <input type="number" id="windowLevelInput" min="-1000" max="1000" value="40">
            </div>
        </div>
        <div class="tool-group">
            <h4>画布控制</h4>
            <div class="tool-item">
                <button id="zoomInBtn" class="btn">放大画布</button>
                <button id="zoomOutBtn" class="btn">缩小画布</button>
                <button id="resetBtn" class="btn">重置画布</button>
            </div>
        </div>
        <div class="tool-group">
            <h4>拼接工具</h4>
            <div class="tool-item">
                <button id="mergeBtn" class="btn">合并图像</button>
                <button id="saveBtn" class="btn">保存结果</button>
            </div>
        </div>
    </div>
</div>

<!-- 加载必要的JavaScript -->
<link rel="stylesheet" href="/css/image-stitching.css">

<!-- 核心库 -->
<script src="/js/dicomParser.js"></script>
<script src="/js/cornerstone.js"></script>
<script src="/js/cornerstoneWADOImageLoader.js"></script>
<script src="/js/cornerstoneTools.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<!-- 应用代码 -->
<script src="/js/image-stitching.js"></script>
