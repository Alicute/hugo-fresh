<!-- 基础容器 -->
<div class="stitching-container">
    <!-- 左侧图像列表 -->
    <div class="image-list-panel">
        <div class="panel-header">
            <h3>图像列表</h3>
            <div id="controlsContainer">
                <input type="file" id="fileInput" accept=".dcm" multiple/>
            </div>
        </div>
        <div class="image-list" id="imageList">
            <!-- 图像列表项将通过JS动态添加 -->
        </div>
    </div>

    <!-- 中间画布区域 -->
    <div class="canvas-container">
        <div id="canvasWrapper">
            <!-- 参考线 -->
            <div id="horizontalGuide" class="guideline horizontal"></div>
            <div id="verticalGuide" class="guideline vertical"></div>
            <!-- 图层容器 -->
            <div id="layersContainer">
                <!-- 图层将通过JS动态添加 -->
            </div>
        </div>
    </div>

    <!-- 右侧工具栏 -->
    <div class="tools-panel">
        <div class="tool-group">
            <h4>基础调节</h4>
            <div class="tool-item">
                <label>缩放</label>
                <input type="range" id="zoomSlider" min="0.1" max="5" step="0.1" value="1">
                <input type="number" id="zoomInput" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="tool-item">
                <label>窗宽</label>
                <input type="range" id="windowWidthSlider" min="1" max="4000" value="400">
                <input type="number" id="windowWidthInput" min="1" max="4000" value="400">
            </div>
            <div class="tool-item">
                <label>窗位</label>
                <input type="range" id="windowLevelSlider" min="-1000" max="1000" value="40">
                <input type="number" id="windowLevelInput" min="-1000" max="1000" value="40">
            </div>
            <div class="tool-item">
                <label>透明度</label>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="1">
            </div>
        </div>
        <div class="tool-group">
            <h4>拼接工具</h4>
            <div class="tool-item">
                <button id="manualAlignBtn" class="btn">手动对齐</button>
                <button id="toggleGuideBtn" class="btn">显示参考线</button>
            </div>
            <div class="tool-item">
                <button id="mergeBtn" class="btn">合并图像</button>
                <button id="saveBtn" class="btn">保存结果</button>
            </div>
        </div>
    </div>
</div>

<!-- 加载必要的JavaScript -->
<link rel="stylesheet" href="/css/image-stitching.css">

<!-- 核心库 -->
<script src="/js/dicomParser.js"></script>
<script src="/js/cornerstone.js"></script>
<script src="/js/cornerstoneWADOImageLoader.js"></script>
<script src="/js/cornerstoneTools.js"></script>
<script src="/js/html2canvas.min.js"></script>

<!-- 应用代码 -->
<script src="/js/image-stitching.js"></script>
