<!-- 基础容器 -->
<div class="stitching-container">
    <!-- 左侧图像列表 -->
    <div class="image-list-panel">
        <div class="panel-header">
            <h3>图像列表</h3>
            <div id="controlsContainer">
                <input type="file" id="fileInput" accept=".dcm" multiple/>
                <label for="fileInput" class="btn">加载DICOM图像</label>
            </div>
        </div>
        <div class="image-list" id="imageList">
            <!-- 图像列表项将通过JS动态添加 -->
        </div>
    </div>

    <!-- 中间画布区域 -->
    <div class="canvas-container">
        <div class="canvas-toolbar">
            <button id="fullscreenBtn" class="canvas-btn" title="全屏">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
        <div id="canvasWrapper">
            <canvas id="fabricCanvas"></canvas>
        </div>
    </div>

    <!-- 右侧工具栏 -->
    <div class="tools-panel">
        <div class="tool-group">
            <h4>图像调节</h4>
            <div class="tool-item">
                <label>窗宽</label>
                <input type="range" id="windowWidthSlider" min="1" max="99999" step="1" value="0">
                <input type="number" id="windowWidthInput" min="1" max="99999" value="0">
            </div>
            <div class="tool-item">
                <label>窗位</label>
                <input type="range" id="windowLevelSlider" min="0" max="65535" step="1" value="0">
                <input type="number" id="windowLevelInput" min="0" max="65535" value="0">
            </div>
            <div class="tool-item">
                <button id="resetImageBtn" class="btn">重置图像</button>
            </div>
        </div>
        <div class="tool-group">
            <h4>画布控制</h4>
            <div class="tool-item">
                <button id="panButton" class="btn" data-tooltip="点击后可以直接拖动画布">拖动画布</button>
                <button id="resetViewBtn" class="btn" data-tooltip="将图像重置到合适的视图位置">重置视图</button>
            </div>
        </div>
        <div class="tool-group">
            <h4>拼接工具</h4>
            <div class="tool-item">
                <button id="mergeBtn" class="btn">合并图像</button>
            </div>
        </div>
    </div>
</div>

<!-- 加载必要的JavaScript -->
<link rel="stylesheet" href="/css/image-stitching.css">

<!-- 核心库 -->
<script src="/js/lib/dicomParser.js"></script>
<script src="/js/lib/cornerstone.js"></script>
<script src="/js/lib/cornerstoneWADOImageLoader.js"></script>
<script src="/js/lib/cornerstoneTools.js"></script>
<script src="/js/lib/fabric.min.js"></script>

<!-- 应用代码 -->
<script src="/js/custom/image-stitching.js"></script>
