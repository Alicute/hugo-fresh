<div style="position: relative; text-align: center; display: block; overflow: hidden;">
    <!-- 图片 -->
    <img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}" loading="lazy"
         style="border: 1px solid #80C7FF; padding: 5px; border-radius: 5px; display: block; margin: 0 auto;" />

    <!-- 水印层 -->
    <div style="position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
                display: flex; flex-direction: column; justify-content: space-evenly;
                z-index: 1; pointer-events: none; clip-path: inset(0); /* 移除裁剪 */
                transform: translate(-50%, -50%);">
        <!-- 文字水印 -->
        <div style="font-size: 18px; color: rgba(169, 169, 169, 0.2); font-weight: bold;
                    transform: rotate(-45deg); white-space: nowrap; user-select: none;">
            乐凯医疗科技有限公司
        </div>
        <div style="font-size: 18px; color: rgba(169, 169, 169, 0.2); font-weight: bold;
                    transform: rotate(-45deg); white-space: nowrap; user-select: none;">
            乐凯医疗科技有限公司
        </div>
        <div style="font-size: 18px; color: rgba(169, 169, 169, 0.2); font-weight: bold;
                    transform: rotate(-45deg); white-space: nowrap; user-select: none;">
            乐凯医疗科技有限公司
        </div>
        <div style="font-size: 18px; color: rgba(169, 169, 169, 0.2); font-weight: bold;
                    transform: rotate(-45deg); white-space: nowrap; user-select: none;">
            乐凯医疗科技有限公司
        </div>
        <!-- 可以根据需要增加更多文字重复，形成水印条纹 -->
    </div>
</div>
