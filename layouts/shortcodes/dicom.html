<div class="dicom-viewer-container">


    <div id="controlsContainer">
        <input type="file" id="fileInput"/>
        <button id="dicomResetButton" class="reset-button">重置</button>
    </div>


    <div id="toast" style="
    position: fixed;
    top: 12%;
    left: 68%;
    transform: translateX(-50%);
    background-color: #0fdb80;
    color: #fff;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 14px;
    z-index: 9999;
    display: none;">
    </div>


    <div class="viewer-container">
        <!-- 左侧工具栏 -->
        <div class="toolbox">
            <button class="tool-button" id="rotateButton" title="旋转">旋转</button>
            <button class="tool-button" id="captureButton" title="拍照">截图</button>
            <button class="tool-button" id="contrastButton" title="反相">反相</button>
            <button class="tool-button" id="sharpenButton" title="锐化" style="display: none">锐化</button>
            <button class="tool-button" id="doubleWireButton" title="双丝测量">双丝</button>
            <!-- 更多按钮可以在这里添加 -->
        </div>

        <!-- 图像展示区域 -->
        <div id="scrollContainer" style="overflow: auto; width: 100%; height: 600px;" onwheel="event.preventDefault();">
            <div id="dicomViewer" style="position: relative;"></div>
        </div>
    </div>


    <div class="controls">
        <div class="info-group">
            <div class="mouse-position">
            <label for="mousePosition">鼠标位置:</label>
            <span id="mousePosition">X: 0, Y: 0, 灰度值: 0</span>
            </div>
        </div>

        <div class="slider-group">
            <div>
                <label for="zoomSlider">缩放:</label>
                <input type="range" id="zoomSlider" min="0.1" max="2.0" step="0.01" value="0.01">
                <input type="number" id="zoomInput" step="0.01" min="0.1" max="2.0" value="0.01" style="width: 60px;">
            </div>
            <div>
                <label for="windowLevelSlider">窗位:</label>
                <input type="range" id="windowLevelSlider" min="0" max="65535" step="1" value="1">
                <input type="number" id="windowLevelInput" step="1" min="-99999" max="99999" value="1"
                       style="width: 60px;">
            </div>
            <div>
                <label for="windowWidthSlider">窗宽:</label>
                <input type="range" id="windowWidthSlider" min="0" max="99999" step="1" value="1">
                <input type="number" id="windowWidthInput" step="1" min="0" max="99999" value="1" style="width: 60px;">
            </div>

            <!-- 添加对比度控制 -->
            <div>
                <label for="contrastSlider">对比度:</label>
                <input type="range" id="contrastSlider" min="0" max="2" step="0.1" value="1">
                <input type="number" id="contrastInput" step="0.1" min="0" max="2" value="1" style="width: 60px;">
            </div>
        </div>
    </div>
</div>

<!-- 修改测量结果弹窗 -->
<div id="doubleWireModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="measurement-container">
            <div class="profile-container">
                <h3>灰度值分布曲线</h3>
                <canvas id="profileCanvas" width="800" height="300"></canvas>
            </div>
            <div id="measurementResults">
                <div class="results-header">
                    <h3>双丝像质计测量结果</h3>
                </div>
                <div class="mtf-container">
                    <div class="mtf-description">
                        <p>MTF (调制传递函数) 测量结果：</p>
                        <p class="mtf-note">注：显示线对分辨率 > 20% 的结果</p>
                    </div>
                    <div id="mtfResults" class="mtf-results"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/cornerstone.js"></script>
<script src="/js/cornerstoneWADOImageLoader.js"></script>
<script src="/js/dicomParser.js"></script>
<script src="/js/html2canvas.min.js"></script>
<script src="/js/lodash.min.js"></script>
<script src="/js/dicom-web.js"></script>
<link rel="stylesheet" href="/css/dicom-web.css">
